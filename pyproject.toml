[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-sentiment-engine"
version = "0.0.1"
description = "Detect causal links between unstructured data and market movements"
readme = "README.md"
authors = [
  { name = "JTall1ne", email = "YOUR_EMAIL_HERE" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
nlp = ["transformers>=4.0", "torch"]
